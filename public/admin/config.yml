# Decap CMS configuration
# Docs: https://decapcms.org/docs/

# GitHub backend with OAuth proxied through Vercel serverless functions
# (see /api/auth.js and /api/callback.js in this repo).
backend:
  name: github
  repo: rishi-optiminastic/akshae-golekar-blog
  branch: main
  base_url: https://akshae-golekar-blog.vercel.app
  auth_endpoint: api/auth
  commit_messages:
    create: "content: create {{collection}} '{{slug}}'"
    update: "content: update {{collection}} '{{slug}}'"
    delete: "content: delete {{collection}} '{{slug}}'"
    uploadMedia: "content: upload '{{path}}'"
    deleteMedia: "content: delete '{{path}}'"

# Editorial workflow lets you save drafts and publish later.
publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://akshae-golekar-blog.vercel.app
display_url: https://akshae-golekar-blog.vercel.app
logo_url: https://akshae-golekar-blog.vercel.app/favicon.svg

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Post"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{pubDate}}"
    sortable_fields: ["pubDate", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", hint: "1-2 sentences. Used for SEO + previews." }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false, default: [] }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
